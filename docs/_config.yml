# Dokploy Enhanced - GitHub Pages Configuration
# https://amirhmoradi.github.io/dokploy-enhanced

title: Dokploy Enhanced
description: Community-powered Dokploy with faster PR integration and enterprise features
baseurl: "/dokploy-enhanced"
url: "https://amirhmoradi.github.io"

# Theme - Using Just the Docs for beautiful documentation
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Color scheme (light/dark)
color_scheme: dark

# Logo and branding
logo: "/assets/images/logo.svg"

# Aux links (top right)
aux_links:
  "View on GitHub": "https://github.com/amirhmoradi/dokploy-enhanced"

aux_links_new_tab: true

# Footer
footer_content: "Dokploy Enhanced is open source under the MIT License. Not affiliated with Dokploy."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Navigation structure
nav_enabled: true
nav_sort: case_insensitive

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Heading anchor links
heading_anchors: true

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Exclude from build
exclude:
  - tasks/
  - prds/
  - "*.md.bak"
  - node_modules/
  - vendor/

# GA (optional)
# ga_tracking: UA-XXXXXXXX-X
